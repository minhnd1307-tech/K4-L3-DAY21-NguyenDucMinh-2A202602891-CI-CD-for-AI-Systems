name: Income Model CI/CD
run-name: "Income Lab - ${{ github.event.head_commit.message || 'Manual verification' }}"

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - '.dvc/config'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so two releases cannot replace the same model concurrently.
concurrency:
  group: income-model-cicd
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Pull data with DVC
        run: |
          # google-auth reads the WIF file through Application Default Credentials.
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///mlflow.db' }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py
      - name: Show precision, recall and confusion matrix
        run: cat outputs/detail.txt
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json, os
          with open('outputs/report.json') as file:
              report = json.load(file)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"f1={report['f1_score']}\n")
          PYEOF
      - name: Save model and report for release
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.joblib
            outputs/report.json
            outputs/detail.txt
          if-no-files-found: error

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import math, os
          f1 = float(os.environ['F1_SCORE'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1.0:
              raise SystemExit(f'FAILED: f1_score {f1} must be in [0.65, 1.0]. Deployment cancelled.')
          print(f'PASSED: f1_score {f1:.4f} >= 0.65.')
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      # ECDSA host key verified over an authenticated SSH connection to this VM.
      SERVER_FINGERPRINT: SHA256:akfSrcplapovIdy/CrWfLo6cDK6QAAhlWWmgEcIoqmA
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
      - name: Install Cloud Storage SDK
        run: pip install google-cloud-storage==2.16.0
      - name: Authenticate release to Cloud Storage
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Compare F1 and publish approved model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: python src/release.py
      - name: Copy serving code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}/src
          strip_components: 1
      - name: Restart API and verify inference
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ env.SERVER_FINGERPRINT }}
          script: |
            set -eu
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl -fsS http://localhost:8080/healthz; then
                curl -fsS http://localhost:8080/score \
                  -H 'Content-Type: application/json' \
                  -d '{"features": [60, 2, 5, 2, 4, 0, 1, 0, 0, 45]}'
                echo 'Health check and inference passed.'
                exit 0
              fi
              sleep 5
            done
            echo 'API failed to become ready within 60 seconds.'
            exit 1
